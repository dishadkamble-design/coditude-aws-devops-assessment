name: Deploy AWS Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: infrastructure-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate CloudFormation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Validate CloudFormation templates
        run: cfn-lint -t infrastructure/*.yaml infrastructure/ec2/ec2.yaml infrastructure/cicd/pipeline.yaml -r ap-south-1

  deploy:
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
    name: Deploy CloudFormation
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ACM certificate configuration
        run: |
          if [ -z "$CERTIFICATE_ARN" ]; then
            echo "ERROR: ACM_CERTIFICATE_ARN GitHub environment variable is required."
            exit 1
          fi
        env:
          CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy Network CloudFormation stack
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/network.yaml \
            --stack-name "${{ inputs.environment }}-coditude-network" \
            --parameter-overrides Environment="${{ inputs.environment }}" \
            --no-fail-on-empty-changeset

      - name: Read Network stack VPC ID
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        id: network
        run: |
          VPC_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ inputs.environment }}-coditude-network" \
            --query "Stacks[0].Outputs[?OutputKey=='VpcId'].OutputValue | [0]" \
            --output text)
          echo "vpc_id=$VPC_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy Security CloudFormation stack
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        run: |
          aws cloudformation deploy \- name: Deployment instructions
            --template-file infrastructure/security.yaml \
            --stack-name "${{ inputs.environment }}-coditude-security" \
            --parameter-overrides \
              Environment="${{ inputs.environment }}" \
              VpcId="${{ steps.network.outputs.vpc_id }}"
            --no-fail-on-empty-changeset

      - name: Read public and private subnet IDs
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        id: subnets
        run: |
          for KEY in PublicSubnetAId PublicSubnetBId PrivateSubnetAId PrivateSubnetBId; do
            VALUE=$(aws cloudformation describe-stacks \
              --stack-name "${{ inputs.environment }}-coditude-network" \
              --query "Stacks[0].Outputs[?OutputKey=='${KEY}'].OutputValue | [0]" \
              --output text)
            echo "${KEY}=${VALUE}" >> "$GITHUB_OUTPUT"
          done

      - name: Read Database Security Group ID
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        id: db_security
        run: |
          DB_SG_ID=$(aws cloudformation describe-stacks \
            --stack-name "${{ inputs.environment }}-coditude-security" \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseSecurityGroupId'].OutputValue | [0]" \
            --output text)
          echo "db_sg_id=$DB_SG_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy Database CloudFormation stack
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/database.yaml \
            --stack-name "${{ inputs.environment }}-coditude-database" \
            --parameter-overrides \
              Environment="${{ inputs.environment }}" \
              PrivateSubnetAId="${{ steps.subnets.outputs.PrivateSubnetAId }}" \
              PrivateSubnetBId="${{ steps.subnets.outputs.PrivateSubnetBId }}" \
              DatabaseSecurityGroupId="${{ steps.db_security.outputs.db_sg_id }}" \
            --no-fail-on-empty-changeset

      - name: Deploy ECR CloudFormation stack
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/ecr.yaml \
            --stack-name "coditude-ecr" \
            --no-fail-on-empty-changeset

      - name: Read ECS Security Group IDs
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        id: ecs_security
        run: |
          for KEY in LoadBalancerSecurityGroupId FrontendSecurityGroupId BackendSecurityGroupId; do
            VALUE=$(aws cloudformation describe-stacks \
              --stack-name "${{ inputs.environment }}-coditude-security" \
              --query "Stacks[0].Outputs[?OutputKey=='${KEY}'].OutputValue | [0]" \
              --output text)
            echo "${KEY}=${VALUE}" >> "$GITHUB_OUTPUT"
          done

      - name: Read ECS Database Outputs
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        id: ecs_database
        run: |
          for KEY in DatabaseEndpoint DatabaseSecretArn; do
            VALUE=$(aws cloudformation describe-stacks \
              --stack-name "${{ inputs.environment }}-coditude-database" \
              --query "Stacks[0].Outputs[?OutputKey=='${KEY}'].OutputValue | [0]" \
              --output text)
            echo "${KEY}=${VALUE}" >> "$GITHUB_OUTPUT"
          done

      - name: Read ECR Repository URIs
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        id: ecr
        run: |
          for KEY in FrontendRepositoryUri BackendRepositoryUri; do
            VALUE=$(aws cloudformation describe-stacks \
              --stack-name "coditude-ecr" \
              --query "Stacks[0].Outputs[?OutputKey=='${KEY}'].OutputValue | [0]" \
              --output text)
            echo "${KEY}=${VALUE}" >> "$GITHUB_OUTPUT"
          done

      - name: Verify ECS images exist in ECR
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        run: |
          for REPO in coditude-frontend coditude-backend; do
            aws ecr describe-images \
              --repository-name "$REPO" \
              --query 'imageDetails[0].imageDigest' \
              --output text |
              grep -q '^sha256:' || {
                echo "ERROR: No Docker image found in $REPO"
                exit 1
              }
          done

      - name: Resolve ECS image URIs
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        id: images
        run: |
          for COMPONENT in frontend backend; do
            REPO="coditude-${COMPONENT}"
            TAG=$(aws ecr describe-images \
              --repository-name "$REPO" \
              --query 'reverse(sort_by(imageDetails[?imageTags != `null`], &imagePushedAt))[0].imageTags[0]' \
              --output text)

            if [ -z "$TAG" ] || [ "$TAG" = "None" ]; then
              echo "ERROR: No tagged image found in $REPO"
              exit 1
            fi

            if [ "$COMPONENT" = "frontend" ]; then
              echo "FRONTEND_IMAGE=${{ steps.ecr.outputs.FrontendRepositoryUri }}:$TAG" >> "$GITHUB_OUTPUT"
            else
              echo "BACKEND_IMAGE=${{ steps.ecr.outputs.BackendRepositoryUri }}:$TAG" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Deploy ECS CloudFormation stack
        if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
        env:
          CERTIFICATE_ARN: ${{ vars.ACM_CERTIFICATE_ARN }}
        run: |
          aws cloudformation deploy \
            --template-file infrastructure/ecs.yaml \
            --stack-name "${{ inputs.environment }}-coditude-ecs" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides \
              Environment="${{ inputs.environment }}" \
              VpcId="${{ steps.network.outputs.vpc_id }}" \
              PublicSubnetAId="${{ steps.subnets.outputs.PublicSubnetAId }}" \
              PublicSubnetBId="${{ steps.subnets.outputs.PublicSubnetBId }}" \
              PrivateSubnetAId="${{ steps.subnets.outputs.PrivateSubnetAId }}" \
              PrivateSubnetBId="${{ steps.subnets.outputs.PrivateSubnetBId }}" \
              LoadBalancerSecurityGroupId="${{ steps.ecs_security.outputs.LoadBalancerSecurityGroupId }}" \
              FrontendSecurityGroupId="${{ steps.ecs_security.outputs.FrontendSecurityGroupId }}" \
              BackendSecurityGroupId="${{ steps.ecs_security.outputs.BackendSecurityGroupId }}" \
              FrontendImage="${{ steps.images.outputs.FRONTEND_IMAGE }}" \
              BackendImage="${{ steps.images.outputs.BACKEND_IMAGE }}" \
              DatabaseEndpoint="${{ steps.ecs_database.outputs.DatabaseEndpoint }}" \
              DatabaseSecretArn="${{ steps.ecs_database.outputs.DatabaseSecretArn }}" \
              CertificateArn="$CERTIFICATE_ARN" \
            --no-fail-on-empty-changeset
