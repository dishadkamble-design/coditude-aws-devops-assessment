
name: Deploy Application to ECS

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'backend/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: ecs-deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate backend Python syntax
        run: python -m compileall -q backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  deploy:
    needs: validate
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
    name: Build and Deploy ECS
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}

    env:
      AWS_REGION: ap-south-1
      ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/coditude-backend:$GITHUB_SHA"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "BACKEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          API_URL: ""
        run: |
          IMAGE="$REGISTRY/coditude-frontend:$GITHUB_SHA"
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
            -t "$IMAGE" ./frontend
          docker push "$IMAGE"
          echo "FRONTEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Check whether ECS services exist
        id: ecs_check
        run: |
          if aws ecs describe-services \
            --cluster "$ENVIRONMENT-coditude-cluster" \
            --services "$ENVIRONMENT-coditude-backend" "$ENVIRONMENT-coditude-frontend" \
            --query 'length(services[?status==`ACTIVE`])' \
            --output text | grep -qx 2; then
            echo "services_exist=true" >> "$GITHUB_OUTPUT"
          else
            echo "services_exist=false" >> "$GITHUB_OUTPUT"
            echo "ECS services not created yet. Images pushed for initial infrastructure deployment."
          fi

      - name: Deploy backend to ECS
        if: steps.ecs_check.outputs.services_exist == 'true'
        env:
          IMAGE: ${{ env.BACKEND_IMAGE }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$ENVIRONMENT-coditude-backend" \
            --query taskDefinition --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
             | .containerDefinitions |= map(if .name == "backend" then .image = $IMAGE else . end)')

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          aws ecs update-service \
            --cluster "$ENVIRONMENT-coditude-cluster" \
            --service "$ENVIRONMENT-coditude-backend" \
            --task-definition "$NEW_ARN"

          aws ecs wait services-stable \
            --cluster "$ENVIRONMENT-coditude-cluster" \
            --services "$ENVIRONMENT-coditude-backend"

      - name: Deploy frontend to ECS
        if: steps.ecs_check.outputs.services_exist == 'true'
        env:
          IMAGE: ${{ env.FRONTEND_IMAGE }}
        run: |
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$ENVIRONMENT-coditude-frontend" \
            --query taskDefinition --output json)

          NEW_TASK_DEF=$(echo "$TASK_DEF" | jq \
            --arg IMAGE "$IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
             | .containerDefinitions |= map(if .name == "frontend" then .image = $IMAGE else . end)')

          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          aws ecs update-service \
            --cluster "$ENVIRONMENT-coditude-cluster" \
            --service "$ENVIRONMENT-coditude-frontend" \
            --task-definition "$NEW_ARN"

          aws ecs wait services-stable \
            --cluster "$ENVIRONMENT-coditude-cluster" \
            --services "$ENVIRONMENT-coditude-frontend"
