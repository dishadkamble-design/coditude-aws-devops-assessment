
name: CI - Build and Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  backend-check:
    name: Backend Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q backend

      - name: Configure AWS credentials using OIDC
        if: ${{ github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          if [ -n "$REGISTRY" ]; then
            IMAGE="$REGISTRY/coditude-backend:$GITHUB_SHA"
          else
            IMAGE="coditude-backend:ci"
          fi

          docker build -t "$IMAGE" ./backend

          if [ -n "$REGISTRY" ]; then
            docker push "$IMAGE"
            echo "BACKEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            echo "AWS deployment disabled. Backend image built locally."
          fi

  frontend-check:
    name: Frontend Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - name: Configure AWS credentials using OIDC
        if: ${{ github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ github.event_name != 'pull_request' && vars.AWS_DEPLOY_ENABLED == 'true' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          API_URL: ""
        run: |
          if [ -n "$REGISTRY" ]; then
            IMAGE="$REGISTRY/coditude-frontend:$GITHUB_SHA"
          else
            IMAGE="coditude-frontend:ci"
          fi

          docker build \
            --build-arg NEXT_PUBLIC_API_URL="$API_URL" \
            -t "$IMAGE" .

          if [ -n "$REGISTRY" ]; then
            docker push "$IMAGE"
            echo "FRONTEND_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          else
            echo "AWS deployment disabled. Frontend image built locally."
          fi

  infrastructure-check:
    name: CloudFormation Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Validate CloudFormation templates
        run: cfn-lint -t infrastructure/*.yaml infrastructure/ec2/ec2.yaml infrastructure/cicd/pipeline.yaml -r ap-south-1
