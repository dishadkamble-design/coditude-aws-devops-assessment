
AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon ECR repositories for Coditude frontend and backend

Resources:
  FrontendECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: coditude-frontend
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep latest 20 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

  BackendECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: coditude-backend
      ImageTagMutability: MUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep latest 20 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 20
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }

Outputs:
  FrontendRepositoryUri:
    Description: Frontend ECR repository URI
    Value: !GetAtt FrontendECRRepository.RepositoryUri

  BackendRepositoryUri:
    Description: Backend ECR repository URI
    Value: !GetAtt BackendECRRepository.RepositoryUri
