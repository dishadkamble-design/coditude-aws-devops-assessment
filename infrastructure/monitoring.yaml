AWSTemplateFormatVersion: '2010-09-09'
Description: CloudWatch monitoring and SNS alerts for Coditude application

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod

  LoadBalancerFullName:
    Type: String
    Description: ALB FullLoadBalancerName attribute

  TargetGroupFullName:
    Type: String
    Description: Backend target group FullTargetGroupName attribute

  AlertEmail:
    Type: String
    Description: Email address for monitoring alerts

Resources:
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub coditude-${Environment}-alerts

  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref AlertTopic

  HighALB5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub coditude-${Environment}-alb-5xx
      AlarmDescription: Alert when ALB returns excessive HTTP 5xx errors
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

  UnhealthyBackendTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub coditude-${Environment}-unhealthy-backend
      AlarmDescription: Alert when backend targets become unhealthy
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - Name: LoadBalancer
          Value: !Ref LoadBalancerFullName
        - Name: TargetGroup
          Value: !Ref TargetGroupFullName
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertTopic

Outputs:
  AlertTopicArn:
    Description: SNS topic ARN for application alerts
    Value: !Ref AlertTopic